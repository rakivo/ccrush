[package]
name = "ccrush"
version = "0.1.0"
edition = "2024"
authors = ["Mark Tyrkba <marktyrkba456@gmail.com>"]
description = "The fastest C compiler in the world"
homepage = "https://github.com/rakivo/ccrush"
repository = "https://github.com/rakivo/ccrush"
license = "MIT"
keywords = ["compiler", "c", "x86-64", "jit", "elf"]
categories = ["compilers", "development-tools"]

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
bitflags         = { version = "2.11.0",  default-features = false }
cranelift-entity = { version = "0.129.1", default-features = false }
libc             = { version = "0.2.183", default-features = false }
memmap2          = { version = "0.9.10",  default-features = false }
thiserror        = { version = "1",       default-features = false }
smallstr         = { version = "0.3.1",   default-features = false }
wyhash           = { version = "0.6.0",   default-features = false }
bytecount        = { version = "0.6.9",   default-features = false }
mimalloc         = { version = "=0.1.47", default-features = false, optional = true }
nohash-hasher    = { version = "0.2.0",   default-features = false, features = ["std"] }
smallvec         = { version = "1.15.1",  default-features = false, features = ["const_new"] }

[profile.release-fast]
inherits = "release"
opt-level = 3
panic = "abort"
codegen-units = 1
lto = "fat"
debug = false
strip = true
overflow-checks = false
debug-assertions = false

# also: set RUSTFLAGS="-C force-frame-pointers=yes"
[profile.profiling]
inherits = "release"
debug = true                      # keep DWARF symbols
split-debuginfo = "packed"        # so perf can find them easily (Linux)
strip = "none"                    # don’t strip symbols
lto = false
codegen-units = 16
overflow-checks = false
panic = "abort"                   # optional: less noise, smaller code
